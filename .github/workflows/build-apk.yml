name: Build Android APK

on:
  push:
    branches:
      - main
      - surya
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/zooner/package-lock.json

      - name: Install dependencies
        working-directory: client/zooner
        run: npm ci

      - name: Build Web Application
        working-directory: client/zooner
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: client/zooner
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x client/zooner/android/gradlew

      - name: Build Android Debug APK
        working-directory: client/zooner/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload Build Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: client/zooner/android/gradle-build.log

      - name: Print Gradle Log On Failure
        if: failure()
        run: tail -n 150 client/zooner/android/gradle-build.log

      - name: Post Failure Log to Commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const fs = require('fs');
            const log = fs.readFileSync('client/zooner/android/gradle-build.log', 'utf8').slice(-3000);
            fetch('https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments', {
              method: 'POST',
              headers: {
                'Authorization': 'token ' + process.env.GH_TOKEN,
                'Content-Type': 'application/json',
                'User-Agent': 'GitHub-Actions'
              },
              body: JSON.stringify({ body: '### Gradle Failure Log\n\`\`\`\n' + log + '\n\`\`\`' })
            }).then(r => console.log('Posted log comment status:', r.status));
          "

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zooner-App-Debug-APK
          path: client/zooner/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
