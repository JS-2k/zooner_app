name: Build Android APK

on:
  push:
    branches:
      - main
      - surya
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/zooner/package-lock.json

      - name: Grant execute permission for gradlew
        run: chmod +x client/zooner/android/gradlew

      - name: Install dependencies
        working-directory: client/zooner
        run: npm ci

      - name: Build Web Application
        working-directory: client/zooner
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: client/zooner
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: client/zooner/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zooner-App-Debug-APK
          path: client/zooner/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
